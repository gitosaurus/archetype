name: CI

on:
  # Unfiltered on purpose.  Under pull_request, "branches" filters on the base
  # branch, so [main] would skip a pull request aimed at another branch -- which
  # is exactly what every pull request in a stack is.  Pushes stay limited to
  # main; widening those too would run everything twice on a branch with a
  # pull request open.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S src -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ./build/archetype --test

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Configure
        run: emcmake cmake -S src -B build-wasm -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-wasm --parallel
      - name: Check artifacts
        run: test -s build-wasm/archetype.js && test -s build-wasm/archetype.wasm
