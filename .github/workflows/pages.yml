name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a newer push finish rather than cancelling
# it partway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - uses: actions/configure-pages@v5
      # Builds the native interpreter (which compiles the games), the wasm
      # interpreter, and assembles both with the page into build-wasm/web.
      - name: Build site
        run: ./drivers/web/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-wasm/web
      - id: deployment
        uses: actions/deploy-pages@v4
